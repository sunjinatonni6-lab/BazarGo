<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BazarGo - Shopping Cart</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/pages/cart.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">BazarGo</a>
      <a href="index.html" class="btn btn-outline" style="color:var(--dark); border-color:var(--border);">
        <i class="fa-solid fa-arrow-left"></i> Continue Shopping
      </a>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Your Shopping Cart</h2>
    <div id="cart-table-wrapper" style="background:#fff; border-radius:8px; border:1px solid var(--border); padding:1.5rem;">
      
      <!-- Loading indicator -->
      <div id="cart-loading" style="text-align:center; padding:2rem; color:var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading your cart...
      </div>

      <!-- Empty state -->
      <div id="cart-empty-message" style="display:none; text-align:center; padding:2rem;">
        <p style="font-size:1.1rem; color:var(--text-muted); margin-bottom:1rem;">Your cart is currently empty.</p>
        <a href="index.html" class="btn btn-primary">Start Shopping</a>
      </div>

      <!-- Cart table -->
      <div id="cart-content" style="display:none;">
        <table id="cart-table" style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="border-bottom:2px solid var(--border); text-align:left;">
              <th style="padding:1rem;">Item</th>
              <th style="padding:1rem;">Price</th>
              <th style="padding:1rem; text-align:center;">Quantity</th>
              <th style="padding:1rem;">Subtotal</th>
              <th style="padding:1rem;">Action</th>
            </tr>
          </thead>
          <tbody id="cart-rows"></tbody>
        </table>

        <div style="text-align:right; margin-top:1.5rem;">
          <h3 id="order-subtotal" style="color:var(--primary); font-size:1.5rem;">Total: 0 BDT</h3>
          <button id="checkout-btn" class="btn btn-primary" style="margin-top:1rem; cursor:pointer;">
            Proceed to Checkout
          </button>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { auth } from "./assets/js/firebase-config.js";
    import { fetchCartItems, removeCartItem, updateCartQuantity } from "./assets/js/cart.js";

    async function renderCart() {
      const loadingEl = document.getElementById("cart-loading");
      const emptyMsg = document.getElementById("cart-empty-message");
      const cartContent = document.getElementById("cart-content");
      const tbody = document.getElementById("cart-rows");
      const subtotalEl = document.getElementById("order-subtotal");

      loadingEl.style.display = "block";
      emptyMsg.style.display = "none";
      cartContent.style.display = "none";

      const items = await fetchCartItems();
      loadingEl.style.display = "none";

      if (!items || items.length === 0) {
        emptyMsg.style.display = "block";
        return;
      }

      cartContent.style.display = "block";
      let grandTotal = 0;

      tbody.innerHTML = items.map(item => {
        const itemPrice = Number(item.price) || 0;
        const itemQty = Number(item.quantity) || 1;
        const rowTotal = itemPrice * itemQty;
        grandTotal += rowTotal;
        const prodId = item.productId || item.id;

        return `
          <tr style="border-bottom:1px solid var(--border);">
            <td style="padding:1rem; display:flex; align-items:center; gap:1rem;">
              <img src="${item.imageUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;" onerror="this.src='https://via.placeholder.com/50'">
              <span style="font-weight:600;">${item.title}</span>
            </td>
            <td style="padding:1rem;">${itemPrice.toLocaleString()} BDT</td>
            <td style="padding:1rem; text-align:center;">
              <div class="qty-control">
                <button class="qty-btn btn-decrease" data-id="${prodId}" data-qty="${itemQty}">-</button>
                <input type="number" class="qty-input" data-id="${prodId}" value="${itemQty}" min="1">
                <button class="qty-btn btn-increase" data-id="${prodId}" data-qty="${itemQty}">+</button>
              </div>
            </td>
            <td style="padding:1rem; font-weight:700; color:var(--dark);">${rowTotal.toLocaleString()} BDT</td>
            <td style="padding:1rem;">
              <button data-id="${prodId}" class="btn-remove" style="color:#ef4444; border:none; background:none; cursor:pointer; font-weight:600;">
                <i class="fa-solid fa-trash"></i> Remove
              </button>
            </td>
          </tr>
        `;
      }).join("");

      subtotalEl.textContent = `Total: ${grandTotal.toLocaleString()} BDT`;

      // Event Listeners for + / - buttons
      document.querySelectorAll(".btn-decrease").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const id = e.currentTarget.dataset.id;
          const currentQty = Number(e.currentTarget.dataset.qty);
          if (currentQty > 1) {
            await updateCartQuantity(id, currentQty - 1);
            await renderCart();
          } else {
            if (confirm("Remove this item from cart?")) {
              await removeCartItem(id);
              await renderCart();
            }
          }
        });
      });

      document.querySelectorAll(".btn-increase").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const id = e.currentTarget.dataset.id;
          const currentQty = Number(e.currentTarget.dataset.qty);
          await updateCartQuantity(id, currentQty + 1);
          await renderCart();
        });
      });

      // Event Listener for direct number input change
      document.querySelectorAll(".qty-input").forEach(input => {
        input.addEventListener("change", async (e) => {
          const id = e.currentTarget.dataset.id;
          const newQty = parseInt(e.currentTarget.value, 10);
          if (newQty > 0) {
            await updateCartQuantity(id, newQty);
          } else {
            await removeCartItem(id);
          }
          await renderCart();
        });
      });

      // Remove item button
      document.querySelectorAll(".btn-remove").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const targetId = e.currentTarget.dataset.id;
          await removeCartItem(targetId);
          await renderCart();
        });
      });
    }

    // Login guard on Proceed to Checkout
    document.getElementById("checkout-btn").addEventListener("click", () => {
      if (!auth.currentUser) {
        alert("Please sign in or create an account to place your order.");
        window.location.href = `login.html?redirect=checkout.html&msg=${encodeURIComponent("Please sign in or create an account to place your order.")}`;
        return;
      }
      window.location.href = "checkout.html";
    });

    renderCart();
  </script>
</body>
</html>
