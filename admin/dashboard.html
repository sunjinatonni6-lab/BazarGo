<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - BazarGo</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="../assets/css/pages/dashboard-admin.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/admin-responsive.css">
</head>
<body>

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <i class="fa-solid fa-boxes-stacked"></i> BazarGo</span> Admin
    </a>
    <ul class="sidebar-menu">
      <li>
        <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      </li>
      <li>
        <a href="products.html"><i class="fa-solid fa-layer-group"></i> Products</a>
      </li>
      <li>
        <a href="orders.html"><i class="fa-solid fa-clipboard-list"></i> Orders</a>
      </li>
      <li>
        <a href="banner.html"><i class="fa-solid fa-image"></i> Hero Banner</a>
      </li>
      <li>
        <a href="../index.html" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live Storefront</a>
      </li>
    </ul>
    <div class="sidebar-footer">
      <a href="../login.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</a>
    </div>
  </aside>

  <!-- Main View Area -->
  <div class="admin-main">
    <header class="admin-topbar">
      <h2>Dashboard Overview</h2>
      <span style="font-size: 0.9rem; color: var(--slate);"><i class="fa-solid fa-user-shield"></i> Administrator</span>
    </header>

    <main class="admin-content">
      <!-- Dynamic Metric Cards -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-icon" style="background: #ffedd5; color: var(--primary);">
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>
          <div>
            <div class="metric-title">Total Products</div>
            <div class="metric-value" id="stat-products">0</div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon" style="background: #e0f2fe; color: #0284c7;">
            <i class="fa-solid fa-cart-shopping"></i>
          </div>
          <div>
            <div class="metric-title">Total Orders</div>
            <div class="metric-value" id="stat-orders">0</div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon" style="background: #dcfce7; color: var(--success);">
            <i class="fa-solid fa-money-bill-trend-up"></i>
          </div>
          <div>
            <div class="metric-title">Total Revenue</div>
            <div class="metric-value" id="stat-revenue">0 BDT</div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon" style="background: #fef3c7; color: var(--warning);">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </div>
          <div>
            <div class="metric-title">Pending Orders</div>
            <div class="metric-value" id="stat-pending">0</div>
          </div>
        </div>
      </div>

      <!-- Recent Orders Card -->
      <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3 style="font-size: 1.1rem; color: var(--dark);">Recent Orders</h3>
          <a href="orders.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 600;">View All Orders &rarr;</a>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Order Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recent-orders-body">
              <!-- Populated dynamically via script -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Dashboard metrics use Firestore as the single source of truth. -->
  <script type="module">
    import { auth, db } from "../assets/js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import {
      collection, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const byId = (id) => document.getElementById(id);
    const money = (value) => `${value.toLocaleString("en-BD", { maximumFractionDigits: 2 })} BDT`;
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const statusText = (order) => String(order.status || "pending").trim().toLowerCase();
    const paymentText = (order) => String(order.paymentStatus || order.payment_status || "").trim().toLowerCase();
    const isRevenueOrder = (order) => {
      // Total Revenue sums orders with an explicitly successful payment status.
      // Cancelled and refunded orders must never contribute to revenue.
      const payment = paymentText(order);
      const status = statusText(order);
      return ["paid", "completed", "success", "succeeded"].includes(payment) &&
        !["cancelled", "canceled", "refunded", "failed"].includes(status) &&
        payment !== "refunded";
    };
    const isPending = (order) => statusText(order) === "pending";

    function dateValue(value) {
      if (!value) return 0;
      if (typeof value.toMillis === "function") return value.toMillis();
      if (typeof value.seconds === "number") return value.seconds * 1000;
      const parsed = new Date(value).getTime();
      return Number.isFinite(parsed) ? parsed : 0;
    }
    function formatDate(value) {
      const ms = dateValue(value);
      return ms ? new Date(ms).toLocaleString() : "—";
    }
    function amountOf(order) {
      const raw = order.total ?? order.totalAmount ?? order.amount;
      if (typeof raw === "number" && Number.isFinite(raw) && raw >= 0) return raw;
      if (typeof raw === "string" && raw.trim() !== "") {
        const parsed = Number(raw.replace(/,/g, "").replace(/৳|BDT/gi, "").trim());
        if (Number.isFinite(parsed) && parsed >= 0) return parsed;
      }
      return 0;
    }
    function showTableMessage(message, isError = false) {
      byId("recent-orders-body").innerHTML =
        `<tr><td colspan="6" style="text-align:center;padding:1.5rem;${isError ? "color:#b91c1c;" : ""}">${escapeHtml(message)}</td></tr>`;
    }

    let unsubscribeOrders = null;
    let unsubscribeProducts = null;

    function renderOrders(snapshot) {
      const orders = snapshot.docs.map((document) => ({
        id: document.id,
        ...document.data()
      }));

      // Sort in memory so legacy documents without createdAt do not break the query.
      orders.sort((a, b) => dateValue(b.createdAt) - dateValue(a.createdAt));

      byId("stat-orders").textContent = orders.length.toLocaleString();
      const revenue = orders.reduce((sum, order) => sum + (isRevenueOrder(order) ? amountOf(order) : 0), 0);
      byId("stat-revenue").textContent = money(revenue);
      byId("stat-pending").textContent = orders.filter(isPending).length.toLocaleString();

      if (!orders.length) {
        showTableMessage("No orders found.");
        return;
      }

      const recent = orders.slice(0, 5);
      byId("recent-orders-body").innerHTML = recent.map((order) => {
        const customer = order.customer && typeof order.customer === "object"
          ? (order.customer.name || order.customer.fullName || order.customer.email || "N/A")
          : (order.customer || order.customerName || "N/A");
        const items = Array.isArray(order.items)
          ? order.items.length
          : (Number.isFinite(Number(order.items)) && Number(order.items) > 0 ? Number(order.items) : 0);
        const status = statusText(order);
        const badgeClass = ["delivered", "completed"].includes(status) ? "badge-completed" :
          (status === "pending" ? "badge-pending" : "");
        return `<tr>
          <td><strong>${escapeHtml(order.id)}</strong></td>
          <td>${escapeHtml(customer)}</td>
          <td>${items}</td>
          <td><strong>${money(amountOf(order))}</strong></td>
          <td>${escapeHtml(formatDate(order.createdAt))}</td>
          <td><span class="badge ${badgeClass}">${escapeHtml(status || "unknown")}</span></td>
        </tr>`;
      }).join("");
    }

    function startDashboard(user) {
      // Products are also read from Firestore; no localStorage/default fallback is used.
      if (unsubscribeProducts) unsubscribeProducts();
      unsubscribeProducts = onSnapshot(collection(db, "products"), (snapshot) => {
        byId("stat-products").textContent = snapshot.size.toLocaleString();
      }, (error) => {
        console.error("Dashboard products listener failed:", error);
        byId("stat-products").textContent = "—";
      });

      if (unsubscribeOrders) unsubscribeOrders();
      unsubscribeOrders = onSnapshot(collection(db, "orders"), (snapshot) => {
        renderOrders(snapshot);
      }, (error) => {
        console.error("Dashboard orders listener failed:", error);
        byId("stat-orders").textContent = "—";
        byId("stat-revenue").textContent = "—";
        byId("stat-pending").textContent = "—";
        showTableMessage("Could not load orders. Check your connection and administrator permissions.", true);
      });
    }

    showTableMessage("Loading orders...");
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "../login.html";
        return;
      }
      try {
        const { getDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js");
        const profile = await getDoc(doc(db, "users", user.uid));
        if (!profile.exists() || profile.data().role !== "admin") {
          alert("Access denied: administrator account required.");
          await signOut(auth);
          window.location.href = "../login.html";
          return;
        }
        startDashboard(user);
      } catch (error) {
        console.error("Could not verify administrator:", error);
        showTableMessage("Unable to verify administrator access. Please sign in again.", true);
      }
    });

    window.addEventListener("beforeunload", () => {
      if (unsubscribeOrders) unsubscribeOrders();
      if (unsubscribeProducts) unsubscribeProducts();
    });
  </script>
</body>
</html>
